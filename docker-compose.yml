version: '3.9'
services:
  addons:
    image: nginx:1.27-alpine
    container_name: quake-addons
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/content.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
