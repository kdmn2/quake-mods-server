version: '3.9'

services:
  ironwail-addons:
    image: ghcr.io/kdmn2/quake-mods-server:latest
    container_name: ironwail-addons
    restart: unless-stopped
    # The app runs as an unprivileged user (uid/gid shown in the startup log). The host directories below must be
    # writable by it. On Unraid (files owned by nobody:users) either chown them to that uid/gid or uncomment:
    # user: "99:100"
    ports:
      - "8080:5000"
    environment:
      APP_SECRET_KEY: "replace-with-long-random-secret"
      PUBLIC_BASE_URL: "http://your-unraid-host:8080"
      PERSIST_ROOT: "/appdata"
      PUBLIC_ROOT: "/public"
      UPLOAD_FOLDER: "/uploads"
      DB_PATH: "/appdata/addons.sqlite3"
      PORT: "5000"
    volumes:
      - /mnt/user/appdata/ironwail-addons/data:/appdata
      - /mnt/user/appdata/ironwail-addons/public:/public
      - /mnt/user/appdata/ironwail-addons/uploads:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
